AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Power Management System - Intelligent Battery and Thermostat Control (Forever Free)

Globals:
  Function:
    Timeout: 60
    Runtime: python3.11
    MemorySize: 256
    Environment:
      Variables:
        POWERMETRICS_TABLE: !Ref PowerMetricsTable
        POWERANALYTICS_TABLE: !Ref PowerAnalyticsTable
        POWERSTATE_TABLE: !Ref PowerStateTable
        PARAMETER_STORE_PREFIX: /powermgr
    Layers:
      - !Ref CommonLayer

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name for resource naming

Resources:
  # ===================================
  # DynamoDB Tables
  # ===================================

  PowerMetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub PowerMetrics-${Environment}
      BillingMode: PAY_PER_REQUEST  # On-demand pricing, no provisioned capacity needed
      AttributeDefinitions:
        - AttributeName: metric_date
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: metric_date
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: PowerManagement
        - Key: Environment
          Value: !Ref Environment

  PowerAnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub PowerAnalytics-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: analysis_date
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: analysis_date
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: PowerManagement
        - Key: Environment
          Value: !Ref Environment

  PowerStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub PowerState-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: state_key
          AttributeType: S
      KeySchema:
        - AttributeName: state_key
          KeyType: HASH
      Tags:
        - Key: Project
          Value: PowerManagement
        - Key: Environment
          Value: !Ref Environment

  # ===================================
  # Lambda Layers
  # ===================================

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub powermgr-common-${Environment}
      Description: Common utilities for Power Management System
      ContentUri: layers/common/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.11

  # ===================================
  # Lambda Functions
  # ===================================

  DataCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub PowerMgr-DataCollector-${Environment}
      CodeUri: functions/data_collector/
      Handler: handler.lambda_handler
      Description: Collects battery, solar, and grid metrics from Tesla API
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PowerMetricsTable
        - SSMParameterReadPolicy:
            ParameterName: !Sub ${AWS::StackName}/*
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:GetParametersByPath
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/powermgr/*
      Events:
        # Peak hours - collect every 5 minutes
        SummerPeakSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(*/5 14-19 ? 5-10 MON-FRI *)
            Description: Collect data every 5 min during summer peak hours
            Enabled: true
        WinterMorningPeakSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(*/5 5-8 ? 1-4,11-12 MON-FRI *)
            Description: Collect data every 5 min during winter morning peak
            Enabled: true
        WinterEveningPeakSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(*/5 17-20 ? 1-4,11-12 MON-FRI *)
            Description: Collect data every 5 min during winter evening peak
            Enabled: true
        # Off-peak - collect every 15 minutes
        OffPeakSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(*/15 * * * ? *)
            Description: Collect data every 15 min during off-peak hours
            Enabled: true
      Tags:
        Project: PowerManagement
        Environment: !Ref Environment

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub PowerMgr-Analytics-${Environment}
      CodeUri: functions/analytics/
      Handler: handler.lambda_handler
      Description: Calculates battery depletion rates and projects battery levels
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PowerMetricsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PowerAnalyticsTable
        - SSMParameterReadPolicy:
            ParameterName: !Sub ${AWS::StackName}/*
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:GetParametersByPath
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/powermgr/*
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref NotificationTopic
      Events:
        # Run every 15 minutes during peak hours
        SummerPeakAnalytics:
          Type: Schedule
          Properties:
            Schedule: cron(*/15 14-19 ? 5-10 MON-FRI *)
            Description: Run analytics every 15 min during summer peak
            Enabled: true
        WinterMorningPeakAnalytics:
          Type: Schedule
          Properties:
            Schedule: cron(*/15 5-8 ? 1-4,11-12 MON-FRI *)
            Description: Run analytics every 15 min during winter morning peak
            Enabled: true
        WinterEveningPeakAnalytics:
          Type: Schedule
          Properties:
            Schedule: cron(*/15 17-20 ? 1-4,11-12 MON-FRI *)
            Description: Run analytics every 15 min during winter evening peak
            Enabled: true
      Tags:
        Project: PowerManagement
        Environment: !Ref Environment

  # ===================================
  # SNS Topic for Notifications
  # ===================================

  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub PowerMgr-Notifications-${Environment}
      DisplayName: Power Management System Notifications
      Tags:
        - Key: Project
          Value: PowerManagement
        - Key: Environment
          Value: !Ref Environment

  # ===================================
  # CloudWatch Log Groups
  # ===================================

  DataCollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/PowerMgr-DataCollector-${Environment}
      RetentionInDays: 7  # Reduced to stay under 5GB free tier

  AnalyticsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/PowerMgr-Analytics-${Environment}
      RetentionInDays: 7  # Reduced to stay under 5GB free tier

Outputs:
  PowerMetricsTableName:
    Description: DynamoDB table for recent power metrics
    Value: !Ref PowerMetricsTable
    Export:
      Name: !Sub ${AWS::StackName}-PowerMetricsTable

  PowerAnalyticsTableName:
    Description: DynamoDB table for analytics results
    Value: !Ref PowerAnalyticsTable
    Export:
      Name: !Sub ${AWS::StackName}-PowerAnalyticsTable

  PowerStateTableName:
    Description: DynamoDB table for system state
    Value: !Ref PowerStateTable
    Export:
      Name: !Sub ${AWS::StackName}-PowerStateTable

  NotificationTopicArn:
    Description: SNS topic for notifications
    Value: !Ref NotificationTopic
    Export:
      Name: !Sub ${AWS::StackName}-NotificationTopic

  DataCollectorFunctionArn:
    Description: ARN of the Data Collector Lambda function
    Value: !GetAtt DataCollectorFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DataCollectorFunction

  AnalyticsFunctionArn:
    Description: ARN of the Analytics Lambda function
    Value: !GetAtt AnalyticsFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-AnalyticsFunction
